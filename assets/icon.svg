<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GUIdance">
  <!-- Concentric corners (rule 5.2): each inner radius is the outer radius minus the 8-unit gap. -->
  <rect x="0" y="0" width="64" height="64" rx="24" fill="#5a3ee4"/>
  <rect x="8" y="8" width="48" height="48" rx="16" fill="#ffffff"/>
  <rect x="16" y="16" width="32" height="32" rx="8" fill="#5a3ee4"/>
  <rect x="24" y="24" width="16" height="16" rx="0" fill="#ffffff"/>
</svg>
